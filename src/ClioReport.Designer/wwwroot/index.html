<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClioReport Designer</title>
<style>
:root {
  --bg: #e9ecf1; --panel: #ffffff; --panel2: #f6f7f9; --line: #e2e5eb; --line2: #cfd4dd; --text: #1b2230; --muted: #566070;
  --accent: #2f4fd0; --accent-soft: #e3e9ff; --paper: #ffffff; --danger: #d6336c; --guide: #c3cad8;
  --shadow: 0 1px 2px rgba(20,30,50,.06), 0 8px 28px rgba(20,30,50,.10);
  --c-page: #64748b; --c-report: #4f46e5; --c-colhead: #0d9488; --c-group: #9333ea; --c-detail: #16a34a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101216; --panel: #1a1d23; --panel2: #20242b; --line: #2b3039; --line2: #3a404b; --text: #e8eaee; --muted: #8f97a6;
    --accent: #7c97ff; --accent-soft: #222c52; --paper: #23272e; --danger: #ff6b9a; --guide: #444b58;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 13px/1.4 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
#app { display: grid; grid-template-rows: 48px 1fr; height: 100vh; }

/* top bar */
#top { display: flex; gap: 8px; align-items: center; padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 650; letter-spacing: -.01em; margin-right: 6px; }
.brand .logo { width: 24px; height: 24px; border-radius: 7px; background: linear-gradient(135deg, var(--accent), #7c4dff); display: grid; place-items: center; color: #fff; }
.brand .logo svg { width: 14px; height: 14px; stroke-width: 2.2; }
.brand small { color: var(--muted); font-weight: 500; }
.grp { display: flex; gap: 2px; padding: 2px; background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; }
.sp { flex: 1; }
#fileName { color: var(--muted); max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
button { font: inherit; color: inherit; background: transparent; border: 1px solid transparent; border-radius: 7px; padding: 5px 9px;
  cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background .12s, border-color .12s; }
button:hover:not(:disabled) { background: var(--accent-soft); }
button:disabled { opacity: .38; cursor: default; }
button.primary { background: var(--accent); color: #fff; font-weight: 600; }
button.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
button.ghost { border-color: var(--line2); background: var(--panel); }
button.danger { color: var(--danger); }
button.danger:hover:not(:disabled) { background: color-mix(in srgb, var(--danger) 12%, transparent); }
button.icon { padding: 5px 7px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line2); cursor: pointer; user-select: none; }
.chip input { accent-color: var(--accent); margin: 0; }
#zval { cursor: pointer; min-width: 44px; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }

#main { display: grid; grid-template-columns: 188px 1fr 300px; min-height: 0; }
#tools, #props { background: var(--panel); overflow: auto; }
#tools { border-right: 1px solid var(--line); padding: 14px 12px; }
#props { border-left: 1px solid var(--line); padding: 14px; }
h4 { margin: 18px 0 8px; font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
h4:first-child { margin-top: 0; }

/* stage + paper */
#stage { overflow: auto; padding: 28px 28px 80px 210px; }
.sheet { position: relative; background: #ffffff; color: #111111; box-shadow: var(--shadow); border-radius: 2px; }
.sheet .guide { position: absolute; border: 1px dashed #b9c0cf; pointer-events: none; }
.band { position: relative; margin-bottom: 0; }
.band .label { position: absolute; top: 0; display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted);
  white-space: nowrap; cursor: pointer; user-select: none; text-align: right; flex-direction: column; align-items: flex-end; gap: 1px; padding: 3px 0; }
.band .label .t { display: flex; align-items: center; gap: 6px; }
.band .label .dot { width: 9px; height: 9px; border-radius: 3px; background: var(--bc); flex: none; }
.band .label b { font-weight: 600; color: var(--text); }
.band .label span { opacity: .75; }
.band.sel .label b { color: var(--bc); }
.band .body { position: relative; border-top: 2px solid var(--bc); border-bottom: 1px dashed color-mix(in srgb, var(--bc) 55%, transparent);
  background: color-mix(in srgb, var(--bc) 6%, transparent); }
.band.sel .body { background-color: color-mix(in srgb, var(--bc) 11%, transparent);
  background-image: linear-gradient(var(--gl) 1px, transparent 1px), linear-gradient(90deg, var(--gl) 1px, transparent 1px);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--bc) 40%, transparent); --gl: color-mix(in srgb, var(--bc) 22%, transparent); }
.band .vh { position: absolute; left: 0; right: 0; bottom: -5px; height: 9px; cursor: ns-resize; z-index: 5; }
.band .vh::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 28px; height: 3px; margin-left: -14px; border-radius: 3px;
  background: var(--bc); opacity: 0; transition: opacity .12s; }
.band:hover .vh::after, .band.sel .vh::after { opacity: .7; }
.el { position: absolute; overflow: hidden; cursor: move; user-select: none; white-space: pre; display: flex; }
.el:hover { outline: 1px solid var(--accent); }
.el.sel { outline: 2px solid var(--accent); z-index: 4; overflow: visible; }
.el .txt { width: 100%; overflow: hidden; }
.el.expr .txt { color: #0a6b43; font-weight: 500; }
.el.ph { background: repeating-linear-gradient(135deg, rgba(120,128,150,.18) 0 6px, rgba(120,128,150,.07) 6px 12px);
  align-items: center; justify-content: center; color: #5b6475; font-size: 11px; }
.el.barcode { background: repeating-linear-gradient(90deg, #222 0 2px, transparent 2px 4px, #222 4px 5px, transparent 5px 8px); opacity: .8; }
 .el.tbl { cursor: move; }
.cell { position: absolute; display: flex; align-items: center; overflow: hidden; white-space: pre; box-sizing: border-box; }
.cell.expr { color: #0a6b43; }
.el.list { outline: 1px dashed var(--accent); background: color-mix(in srgb, var(--accent) 4%, transparent); }
.el.list .tag { position: absolute; right: 2px; top: -15px; font-size: 10px; padding: 0 6px; border-radius: 99px;
  background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.el.list .ghost { position: absolute; left: 0; right: 0; border: 1px dashed var(--guide); opacity: .8; pointer-events: none; }
.handle { position: absolute; width: 9px; height: 9px; background: #fff; border: 1.5px solid var(--accent); border-radius: 2px; z-index: 6; }
.empty { margin: 60px auto; max-width: 320px; text-align: center; color: var(--muted); }

/* props */
.ptitle { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.ptitle b { font-size: 14px; letter-spacing: -.01em; }
.badge { font-size: 10.5px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.row { display: grid; grid-template-columns: 86px 1fr; gap: 8px; align-items: center; margin-bottom: 7px; }
.row > label { color: var(--muted); }
input[type=text], input[type=number], select, textarea { width: 100%; padding: 5px 8px; border: 1px solid var(--line2); border-radius: 7px;
  background: var(--panel); color: var(--text); font: inherit; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); border-color: var(--accent); }
textarea { min-height: 52px; resize: vertical; font: 12px ui-monospace, Consolas, monospace; }
.xywh { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
.num { position: relative; }
.num span { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--muted); pointer-events: none; font-weight: 600; }
.num input { padding-left: 26px; }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { border-radius: 0; padding: 4px 9px; border: 0; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: #fff; }
.sw { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
.sw input { display: none; }
.sw i { width: 30px; height: 17px; border-radius: 99px; background: var(--line2); position: relative; transition: background .12s; flex: none; }
.sw i::after { content: ""; position: absolute; left: 2px; top: 2px; width: 13px; height: 13px; border-radius: 50%; background: #fff; transition: transform .12s; }
.sw input:checked + i { background: var(--accent); }
.sw input:checked + i::after { transform: translateX(13px); }
.card { border: 1px solid var(--line); background: var(--panel2); border-radius: 9px; padding: 9px; margin-bottom: 8px; }
.hint { color: var(--muted); font-size: 12px; line-height: 1.5; }
.colour { display: flex; gap: 6px; }
.colour input[type=color] { width: 34px; padding: 1px; height: 28px; border: 1px solid var(--line2); border-radius: 7px; background: var(--panel); }
.actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--text); width: min(780px, 92vw); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(10,14,22,.45); }
dialog textarea { width: 100%; height: 55vh; font: 12px ui-monospace, Consolas, monospace; }
#tbDlg { width: min(900px, 94vw); }
.tbgrid { display: grid; grid-template-columns: 24px 1.2fr 1.2fr 78px 64px 104px 76px; gap: 6px; align-items: center; margin-bottom: 5px; }
.tbgrid.head { color: var(--muted); font-size: 11px; font-weight: 650; }
#tbCols { max-height: 44vh; overflow: auto; padding-right: 4px; }
#tbCols input[type=text], #tbCols input[type=number], #tbCols select { width: 100%; min-width: 0; }
#tbOpts { gap: 16px; }
#tbOpts [hidden] { display: none; }
#tbOpts label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #1b2230; color: #fff;
  padding: 7px 14px; border-radius: 9px; opacity: 0; transition: opacity .2s; pointer-events: none; box-shadow: var(--shadow); }
#toast.on { opacity: .96; }

/* ---- v2: structure, rail, outline, ruler ------------------------------------------------------------------- */
:root {
  --bg: #e9ebef; --panel: #ffffff; --panel2: #f4f5f7; --line: #e3e5ea; --line2: #cfd3db; --text: #151922; --muted: #5b6475;
  --accent: #d9480f; --accent-soft: #fdebe2; --on-accent: #ffffff; --dot: rgba(20,30,50,.14); --tick: #8c95a5;
  --shadow: 0 0 0 1px rgba(20,30,50,.06), 0 10px 30px rgba(20,30,50,.12);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1014; --panel: #161a20; --panel2: #1c2027; --line: #262b34; --line2: #373d49; --text: #e9ebef; --muted: #98a0af;
    --accent: #ff8a4c; --accent-soft: #3a2316; --on-accent: #1d0f06; --dot: rgba(255,255,255,.09); --tick: #6d7586;
    --shadow: 0 0 0 1px rgba(255,255,255,.05), 0 12px 34px rgba(0,0,0,.55);
  }
}
html, body { font-size: 12.5px; font-variant-numeric: tabular-nums; }
#app { grid-template-rows: 44px 1fr 26px; }
#top { height: 44px; padding: 0 10px; gap: 6px; }
.brand { font-weight: 700; font-size: 13px; letter-spacing: -.01em; }
.brand .logo { width: 22px; height: 22px; border-radius: 6px; background: var(--text); color: var(--panel); }
.brand .logo svg { width: 13px; height: 13px; stroke-width: 2.4; }
.grp { background: transparent; border: 0; padding: 0; gap: 2px; }
.grp + .grp { padding-left: 8px; margin-left: 2px; border-left: 1px solid var(--line); }
button { border-radius: 6px; padding: 4px 8px; }
button.primary { background: var(--accent); color: var(--on-accent); }
.seg button.on { background: var(--accent); color: var(--on-accent); }
.doc { display: flex; align-items: center; gap: 7px; color: var(--muted); max-width: 40%; }
#fileName { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; color: var(--text); }
#dirty { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
.chip { padding: 3px 9px; }

#main { grid-template-columns: 46px 232px 1fr 304px; }
#rail { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; }
#rail .rbtn { width: 34px; height: 34px; padding: 0; justify-content: center; position: relative; }
#rail .rbtn svg.i { width: 18px; height: 18px; }
#rail .sep { width: 22px; height: 1px; background: var(--line); margin: 6px 0; }
[data-tip]:hover::after { content: attr(data-tip); position: absolute; left: calc(100% + 8px); top: 50%; transform: translateY(-50%); z-index: 50;
  background: var(--text); color: var(--panel); padding: 3px 8px; border-radius: 5px; font-size: 11.5px; white-space: nowrap; pointer-events: none; }
#bandMenu { position: fixed; z-index: 60; width: 190px; padding: 5px; background: var(--panel); border: 1px solid var(--line2);
  border-radius: 9px; box-shadow: var(--shadow); }
#bandMenu button { width: 100%; justify-content: flex-start; gap: 9px; padding: 5px 8px; }
#bandMenu .dot { width: 9px; height: 9px; border-radius: 3px; }
#bandMenu .ttl { padding: 4px 8px 6px; color: var(--muted); font-size: 11.5px; }

#outline { background: var(--panel); border-right: 1px solid var(--line); overflow: auto; padding: 6px 6px 20px; }
#outline .ohead { padding: 6px 8px; font-weight: 650; display: flex; align-items: center; }
.orow { display: flex; align-items: center; gap: 7px; padding: 4px 8px; border-radius: 6px; cursor: pointer; min-height: 26px; }
.orow:hover { background: var(--panel2); }
.orow.sel { background: var(--accent-soft); color: var(--text); box-shadow: inset 2px 0 0 var(--accent); }
.orow .dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.orow .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.orow .meta { color: var(--muted); font-size: 11px; flex: none; }
.orow.obnd { font-weight: 600; margin-top: 4px; }
.orow.oel { color: var(--muted); }
.orow.oel.sel { color: var(--text); }
.orow svg.i { width: 14px; height: 14px; flex: none; opacity: .75; }

#stagewrap { position: relative; min-height: 0; min-width: 0; display: grid; }
#stage { overflow: auto; padding: 0 28px 90px 210px; background-color: var(--bg);
  background-image: radial-gradient(var(--dot) 1px, transparent 1px); background-size: 18px 18px; }
#ruler { position: sticky; top: 0; z-index: 9; height: 22px; margin: 0 0 14px; background-color: var(--panel); border-radius: 0 0 4px 4px;
  box-shadow: 0 1px 0 var(--line2), 0 6px 14px -8px rgba(20,30,50,.35); overflow: hidden; }
#ruler .rl { position: absolute; top: 2px; font-size: 9.5px; color: var(--muted); }
#ruler .rm { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--text) 8%, transparent); }
#ruler .rsel { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--accent) 32%, transparent); border-left: 1px solid var(--accent); border-right: 1px solid var(--accent); }
.sheet { margin-top: 2px; }
.zoompill { position: absolute; right: 22px; bottom: 16px; display: flex; align-items: center; background: var(--panel); border: 1px solid var(--line2);
  border-radius: 999px; padding: 2px; box-shadow: var(--shadow); }
.zoompill button { border-radius: 999px; }
#zval { min-width: 50px; justify-content: center; color: var(--text); }
.el.sel { outline-color: var(--accent); }
.el:hover { outline-color: var(--accent); }
.handle { border-color: var(--accent); }

#props { padding: 12px 14px 24px; }
#props h4 { margin: 18px 0 9px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 12px; font-weight: 650; text-transform: none; letter-spacing: 0; color: var(--text); }
#props h4:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
.ptitle b { font-size: 14px; }
input[type=text], input[type=number], select, textarea { border-radius: 6px; padding: 4px 8px; }
.card { background: transparent; }
.badge { background: var(--panel2); color: var(--muted); border: 1px solid var(--line); font-weight: 500; }

.num input[type=number] { padding-left: 25px; }
.band.sel .body { background-color: color-mix(in srgb, var(--bc) 8%, transparent); }
/* v5: rdlc import */
#rdlcDlg { width: min(640px, 92vw); padding: 18px 20px; border: 1px solid var(--line2); border-radius: 14px; background: var(--panel); color: var(--text); }
#rdlcDlg::backdrop { background: rgba(10,14,24,.55); }
#rdlcWarn { margin: 0 0 14px; padding-left: 18px; max-height: 50vh; overflow: auto; font-size: 12.5px; line-height: 1.5; }
/* v4: preview */
#pvDlg { width: min(1100px, 94vw); height: 90vh; padding: 0; border: 1px solid var(--line2); border-radius: 14px; background: var(--panel); color: var(--text); }
#pvDlg[open] { display: flex; flex-direction: column; }
#pvDlg::backdrop { background: rgba(10,14,24,.55); }
.pvhead { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.pvhead .sp { flex: 1; }
.pvhead .hint { margin: 0; }
#pvFrame { flex: 1; width: 100%; border: 0; background: #525659; }
#pvMsg { flex: 1; margin: 0; padding: 18px 20px; white-space: pre-wrap; font: 13px/1.5 ui-monospace, Consolas, monospace; overflow: auto; }
#pvMsg.err { color: var(--danger); }
/* v3: scrollbars + drag-drop + multi-select */
.marquee { position: absolute; z-index: 6; pointer-events: none; border: 1px solid var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.el.msel { outline: 2px solid var(--accent); outline-offset: 0; }
.hint { color: var(--muted); font-size: 11.5px; line-height: 1.5; margin: 12px 0 0; }
#props .seg button { padding: 5px 4px; font-size: 12px; }
* { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--muted) 40%, transparent) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--muted) 38%, transparent); border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--muted) 65%, transparent); background-clip: content-box; border: 2px solid transparent; }
::-webkit-scrollbar-corner { background: transparent; }
.rbtn[draggable=true] { cursor: grab; }
.rbtn[draggable=true]:active { cursor: grabbing; }
body.dragging .band .body { outline: 1px dashed color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: -1px; }
.band .body.droptarget { outline: 2px solid var(--accent) !important; outline-offset: -2px; background-color: color-mix(in srgb, var(--accent) 10%, transparent); }
#status { display: flex; align-items: center; gap: 12px; padding: 0 12px; background: var(--panel); border-top: 1px solid var(--line); color: var(--muted); font-size: 11.5px; }
#statSel { color: var(--text); font-weight: 500; }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="brand"><div class="logo" id="logo"></div><span>ClioReport</span></div>
    <div class="grp">
      <button id="bNew" title="New report"></button>
      <button id="bOpen" title="Open JSON"></button>
      <button id="bRdlc" title="Import an .rdlc / .rdl report (needs the local host)"></button>
      <input type="file" id="rdlcInput" accept=".rdlc,.rdl,.xml" hidden>
      <button id="bSaveAs" title="Save as" class="icon"></button>
    </div>
    <div class="grp">
      <button id="bUndo" class="icon" title="Undo (Ctrl+Z)"></button>
      <button id="bRedo" class="icon" title="Redo (Ctrl+Y)"></button>
    </div>
    <span class="sp"></span>
    <div class="doc"><span id="fileName"></span><i id="dirty" title="Unsaved changes" hidden></i></div>
    <span class="sp"></span>
    <label class="chip" title="Snap to 0.5 mm"><input type="checkbox" id="snap" checked> Snap</label>
    <button id="bJson" class="ghost"></button>
    <button id="bPreview" class="ghost" title="Preview as PDF (needs the local host)"></button>
    <button id="bSave" class="primary" title="Save (Ctrl+S)"></button>
    <input type="file" id="fileInput" accept=".clio,.json,application/json" hidden>
  </div>
  <div id="main">
    <div id="rail"></div>
    <div id="outline"></div>
    <div id="stagewrap">
      <div id="stage"><div id="page"></div></div>
      <div class="zoompill"><button id="zOut" class="icon" title="Zoom out"></button><button id="zval"></button><button id="zIn" class="icon" title="Zoom in"></button></div>
    </div>
    <div id="props"></div>
  </div>
  <div id="status"><span id="statSel"></span><span class="sp"></span><span>Drag to move · arrows nudge · Alt = no snap · Ctrl+Z undo · Ctrl+D duplicate</span></div>
</div>
<div id="bandMenu" hidden></div>
<dialog id="jsonDlg">
  <h3 style="margin:0 0 10px">Report JSON</h3>
  <textarea id="jsonText" spellcheck="false"></textarea>
  <p id="jsonErr" class="hint" style="color:var(--danger)"></p>
  <div class="actions" style="justify-content:flex-end">

const bodyWidth = () => def.page.width - 2 * def.page.margin;

  actions(p, btn(ico('back') + 'Report settings', () => select({ kind: 'report' })));
}

function reportProps(p) {
  title(p, 'Report', 'settings');
  field(p, 'Name', 'text', def, 'name', { live: false });
  field(p, 'Data source', 'text', def, 'dataSource', { live: false, placeholder: 'collection name' });
  h4(p, 'Page (mm)');
  const preset = document.createElement('div'); preset.className = 'row';
  preset.append(Object.assign(document.createElement('label'), { textContent: 'Preset' }));
  const sp = document.createElement('select');
  sp.innerHTML = '<option value="">custom</option><option value="210x297">A4 portrait</option><option value="297x210">A4 landscape</option><option value="148x210">A5 portrait</option><option value="210x148">A5 landscape</option><option value="216x279">Letter portrait</option>';
  sp.value = `${def.page.width}x${def.page.height}`; if (sp.selectedIndex === -1) sp.value = '';
  sp.onchange = () => { if (!sp.value) return; const [w, h] = sp.value.split('x').map(Number); def.page.width = w; def.page.height = h; commit(); renderCanvas(); renderProps(); };
  preset.append(sp); p.append(preset);
  field(p, 'Width', 'number', def.page, 'width', { rerender: true }); field(p, 'Height', 'number', def.page, 'height', { rerender: true });
  field(p, 'Margin', 'number', def.page, 'margin');
  field(p, 'Columns', 'number', def.page, 'columns', { step: 1, default: 1 });
  field(p, 'Column gap', 'number', def.page, 'columnGap');
  p.append(Object.assign(document.createElement('p'), { className: 'hint', textContent: `Body width ${round(bodyWidth())} mm. With columns > 1 the detail band becomes a cell.` }));

  h4(p, 'Groups');
  def.groups.forEach((g, i) => {
    const box = document.createElement('div'); box.className = 'card';
    field(box, 'Name', 'text', g, 'name', { live: false });
    field(box, 'Expression', 'text', g, 'expression', { live: false });
    field(box, 'New page', 'check', g, 'pageBreakBefore');
    box.append(btn(ico('trash') + 'Remove', () => { def.groups.splice(i, 1); commit(); renderProps(); }, 'danger'));
    p.append(box);
  });
  p.append(btn(ico('plus') + 'Group', () => { def.groups.push({ name: 'group' + (def.groups.length + 1), expression: 'field' }); commit(); renderProps(); }));

  h4(p, 'Aggregates');
  def.aggregates.forEach((a, i) => {
    const box = document.createElement('div'); box.className = 'card';
    field(box, 'Name', 'text', a, 'name', { live: false });
    field(box, 'Function', 'select', a, 'function', { options: FUNCTIONS, default: 'sum' });
    field(box, 'Expression', 'text', a, 'expression', { live: false });
    field(box, 'Reset on', 'select', a, 'group', { options: ['', ...def.groups.map(g => g.name)] });
    box.append(btn(ico('trash') + 'Remove', () => { def.aggregates.splice(i, 1); commit(); renderProps(); }, 'danger'));
    p.append(box);
  });
  p.append(btn(ico('plus') + 'Aggregate', () => { def.aggregates.push({ name: 'total', function: 'sum', expression: 'qty' }); commit(); renderProps(); }));
}

function initChrome() {
  $('logo').innerHTML = ico('logo');
  $('bNew').innerHTML = ico('new') + 'New'; $('bOpen').innerHTML = ico('open') + 'Open';
  $('bSave').innerHTML = ico('save') + 'Save'; $('bSaveAs').innerHTML = ico('saveas'); $('bSaveAs').title = 'Save as…';
  $('bUndo').innerHTML = ico('undo'); $('bRedo').innerHTML = ico('redo');
  $('zOut').innerHTML = ico('minus'); $('zIn').innerHTML = ico('plus'); $('bJson').innerHTML = ico('json') + 'JSON'; $('bPreview').innerHTML = ico('eye') + 'Preview'; $('bRdlc').innerHTML = ico('layers') + 'Import RDLC';
  showZoom();
}
function showZoom() { $('zval').title = 'Click to fit the page width'; $('zval').textContent = Math.round(zoom / 4 * 100) + '%'; }
function stepZoom(d) {
  zoom = Math.min(12, Math.max(1.5, zoom * (d > 0 ? 1.15 : 1 / 1.15))); showZoom(); renderCanvas();
}
function fitZoom() {
  const room = $("stage").clientWidth - 210 - 44;
  if (room > 100) zoom = Math.min(8, Math.max(1.5, room / def.page.width));
  showZoom(); renderCanvas();
}

function renderAll() { renderTools(); renderCanvas(); renderProps(); refreshButtons(); $('fileName').textContent = fileName || 'Untitled report'; }

// ---------------------------------------------------------------- files
function load(text, name, handle) {
  let raw;
  try { raw = JSON.parse(text); } catch (e) { toast('Not valid JSON: ' + e.message); return false; }
  if (raw && typeof raw === 'object' && !Array.isArray(raw) && !Array.isArray(raw.bands)) {
    // Not a report: most likely a sample-data file. Keep it for Preview instead of silently failing.
    sampleData = raw; sampleName = name || 'sample data';
    try { if (text.length < 2e6) { localStorage.setItem('clio.sampleData', text); localStorage.setItem('clio.sampleName', sampleName); } } catch { }
    toast('"' + sampleName + '" is not a report, so it was loaded as sample data. Open a report, then press Preview.', 6000);
    return false;
  }
  if (!raw || !Array.isArray(raw.bands)) { toast('This does not look like a ClioReport definition.', 4000); return false; }
  def = normalize(raw); sel = { kind: 'report' }; undoStack = []; redoStack = []; lastSnap = JSON.stringify(def);
  fileName = name || ''; fileHandle = handle || null; savedSnap = lastSnap;
  renderAll(); fitZoom(); return true;
}
const serialize = () => JSON.stringify(clean(def), null, 2) + '\n';
async function saveAs() {
  const text = serialize();
  if (window.showSaveFilePicker) {
    try {
      const h = await window.showSaveFilePicker({ suggestedName: (def.name || 'report') + '.clio', types: [{ description: 'ClioReport report', accept: { 'application/json': ['.clio'] } }] });
      const w = await h.createWritable(); await w.write(text); await w.close();
      fileHandle = h; fileName = h.name; savedSnap = lastSnap; renderAll(); toast('Saved'); return;
    } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  a.download = (def.name || 'report') + '.clio'; a.click(); URL.revokeObjectURL(a.href); savedSnap = lastSnap; refreshButtons(); toast('Downloaded');
}
// Inside the Visual Studio extension (WebView2) the file belongs to VS: saving posts the text to it instead of using the browser.
let hostBound = false, hostDirty = null;
const hostPost = m => { try { window.chrome.webview.postMessage(m); } catch (_) { } };
async function save() {
  if (hostBound) { hostPost('save\n' + serialize()); savedSnap = lastSnap; refreshButtons(); toast('Saved'); return; }
  if (!fileHandle) return saveAs();
  try { const w = await fileHandle.createWritable(); await w.write(serialize()); await w.close(); savedSnap = lastSnap; refreshButtons(); toast('Saved'); }
  catch (e) { return saveAs(); }
}
async function openFile() {
  if (window.showOpenFilePicker) {
    try {
      const [h] = await window.showOpenFilePicker({ types: [{ description: 'ClioReport report', accept: { 'application/json': ['.clio', '.json'] } }] });
      const f = await h.getFile(); load(await f.text(), f.name, h); return;
    } catch (e) { if (e.name === 'AbortError') return; }
  }
  $('fileInput').click();
}
$('fileInput').onchange = async ev => { const f = ev.target.files[0]; if (f) load(await f.text(), f.name, null); ev.target.value = ''; };
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', async e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) load(await f.text(), f.name, null); });

// ---------------------------------------------------------------- wiring
$('bNew').onclick = () => { if (undoStack.length && !confirm('Discard unsaved changes?')) return; def = blankReport(); sel = { kind: 'report' }; undoStack = []; redoStack = []; lastSnap = JSON.stringify(def); fileHandle = null; fileName = ''; savedSnap = lastSnap; renderAll(); fitZoom(); };
$('bOpen').onclick = openFile; $('bSave').onclick = save; $('bSaveAs').onclick = saveAs;
$('bUndo').onclick = undo; $('bRedo').onclick = redo;
$('zval').onclick = fitZoom; $('zOut').onclick = () => stepZoom(-1); $('zIn').onclick = () => stepZoom(1);
$('snap').onchange = ev => { snap = ev.target.checked; };
// ---------------------------------------------------------------- PDF preview (needs src/ClioReport.Designer host)
let sampleData = null, sampleName = '', pvUrl = null;
try { const k = localStorage.getItem('clio.sampleData'); if (k) { sampleData = JSON.parse(k); sampleName = localStorage.getItem('clio.sampleName') || 'sample data'; } } catch { }
function pvShow(text, isErr) {
  $('pvFrame').hidden = true; $('pvFrame').removeAttribute('src');
  const m = $('pvMsg'); m.hidden = false; m.textContent = text; m.className = isErr ? 'err' : '';
}
function pvLabel() { $('pvData').textContent = sampleData ? 'Data: ' + sampleName : 'No sample data: fields are blank'; $('pvClear').hidden = !sampleData; }
async function preview() {
  const dlg = $('pvDlg'); if (!dlg.open) dlg.showModal();
  pvLabel();
  if (location.protocol === 'file:') {
    pvShow('Preview needs the local host.\n\n  dotnet run --project src/ClioReport.Designer\n\nthen open http://localhost:5178 instead of this file.', true); return;
  }
  pvShow('Rendering…', false);
  try {
    const res = await fetch('api/preview', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ report: JSON.parse(serialize()), data: sampleData || undefined }) });
    if (!res.ok) { pvShow(await res.text(), true); return; }
    const url = URL.createObjectURL(await res.blob());
    if (pvUrl) URL.revokeObjectURL(pvUrl); pvUrl = url;
    $('pvMsg').hidden = true; const f = $('pvFrame'); f.hidden = false; f.src = url;
  } catch (e) { pvShow('Cannot reach the preview host (' + e.message + '). Is it still running?', true); }
}
$('bRdlc').onclick = () => {
  if (location.protocol === 'file:') { toast('RDLC import needs the local host: dotnet run --project src/ClioReport.Designer', 6000); return; }
  $('rdlcInput').click();
};
$('rdlcInput').onchange = async ev => {
  const f = ev.target.files[0]; ev.target.value = ''; if (!f) return;
  if (undoStack.length && !confirm('Replace the report you are editing? Unsaved changes will be lost.')) return;
  try {
    const res = await fetch('api/import-rdlc', { method: 'POST', body: await f.arrayBuffer() });
    if (!res.ok) { toast('Cannot import: ' + await res.text(), 6000); return; }
    const out = await res.json();
    if (!load(out.report, f.name.replace(/\.(rdlc|rdl|xml)$/i, '') + '.clio', null)) return;
    $('rdlcSum').textContent = f.name + ': imported' + (out.warnings.length ? ', ' + out.warnings.length + ' thing(s) need your attention.' : ' with no warnings.');
    const ul = $('rdlcWarn'); ul.textContent = '';
    for (const w of out.warnings) { const li = document.createElement('li'); li.textContent = w; ul.append(li); }
    $('rdlcDlg').showModal();
  } catch (e) { toast('Cannot reach the host (' + e.message + ')', 6000); }
};
$('rdlcOk').onclick = () => $('rdlcDlg').close();
$('bPreview').onclick = preview;
$('pvRefresh').onclick = preview;
$('pvClose').onclick = () => $('pvDlg').close();
$('pvPick').onclick = () => $('pvFile').click();
$('pvClear').onclick = () => { sampleData = null; sampleName = ''; try { localStorage.removeItem('clio.sampleData'); localStorage.removeItem('clio.sampleName'); } catch { } preview(); };
$('pvFile').onchange = async ev => {
  const f = ev.target.files[0]; ev.target.value = ''; if (!f) return;
  try {
    const text = await f.text(), obj = JSON.parse(text);
    if (!obj || typeof obj !== 'object' || Array.isArray(obj)) throw new Error('the file must contain a JSON object');
    sampleData = obj; sampleName = f.name;
    try { if (text.length < 2e6) { localStorage.setItem('clio.sampleData', text); localStorage.setItem('clio.sampleName', f.name); } } catch { }
    preview();
  } catch (e) { toast('Not usable as sample data: ' + e.message); }
};
$('bJson').onclick = () => { $('jsonText').value = serialize(); $('jsonErr').textContent = ''; $('jsonDlg').showModal(); };
$('jsonClose').onclick = () => $('jsonDlg').close();
$('jsonCopy').onclick = async () => { try { await navigator.clipboard.writeText($('jsonText').value); toast('Copied'); } catch (_) { $('jsonText').select(); } };
$('jsonApply').onclick = () => {
  try {
    const raw = JSON.parse($('jsonText').value);
    if (!raw || !Array.isArray(raw.bands)) throw new Error('"bands" array is missing');
    def = normalize(raw); sel = { kind: 'report' }; commit(); renderAll(); $('jsonDlg').close();
  } catch (e) { $('jsonErr').textContent = e.message; }
};

window.addEventListener('keydown', ev => {
  const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName);
  const mod = ev.ctrlKey || ev.metaKey;
  if (mod && ev.key.toLowerCase() === 's') { ev.preventDefault(); save(); return; }
  if (typing) return;
  if (mod && ev.key.toLowerCase() === 'z' && !ev.shiftKey) { ev.preventDefault(); undo(); }
  else if (mod && (ev.key.toLowerCase() === 'y' || (ev.key.toLowerCase() === 'z' && ev.shiftKey))) { ev.preventDefault(); redo(); }
  else if (mod && ev.key.toLowerCase() === 'd') { ev.preventDefault(); duplicateSel(); }
  else if (ev.key === 'Delete' || ev.key === 'Backspace') { ev.preventDefault(); deleteSel(); }
  else if (mod && ev.key.toLowerCase() === 'a' && sel.kind !== 'report') {
    ev.preventDefault(); const bi = sel.b;
    setMulti(bi, def.bands[bi].elements.map((_, i) => [i]));
  }
  else if (ev.key === 'Escape' && sel.kind === 'element') select(sel.path.length > 1 ? { kind: 'element', b: sel.b, path: sel.path.slice(0, -1) } : { kind: 'band', b: sel.b });
  else if (sel.kind === 'element' && ev.key.startsWith('Arrow')) {
    ev.preventDefault();
    const step = ev.shiftKey ? 5 : 0.5, es = selList().map(p => elAt(sel.b, p));
    const mx = ev.key === 'ArrowLeft' ? -step : ev.key === 'ArrowRight' ? step : 0, my = ev.key === 'ArrowUp' ? -step : ev.key === 'ArrowDown' ? step : 0;
    const cx = Math.max(mx, -Math.min(...es.map(e => e.x))), cy = Math.max(my, -Math.min(...es.map(e => e.y)));
    es.forEach(e => { e.x = round(e.x + cx); e.y = round(e.y + cy); });
    commit(); renderCanvas(); renderProps();
  }
});

// test hook + startup
window.__designer = { openTableWizard, setSample: (v, n) => { sampleData = v; sampleName = n || 'test'; }, openFromHost: (text, name) => { if (load(text, name, null)) { hostBound = true; hostDirty = null; refreshButtons(); } }, get sel() { return sel; }, get multi() { return multi; }, get def() { return def; }, set def(v) { def = v; }, clean: () => clean(def), load, select, renderAll };
initChrome();
renderAll();
fitZoom();
</script>
